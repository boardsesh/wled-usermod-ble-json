; WLED v16.0.1 / 29b389df1c1aaec6ff53aea742d17063b985906c only.
; Never change partitions: app0/app1 are each 0x180000 bytes.
[ble_json]
; Explicitly retain WLED's local LED driver with nested external-user library builds.
lib_deps = ${env:esp32dev.lib_deps}
  symlink://@WLED_ROOT@/lib/NeoESP32RmtHI
build_flags = ${env:esp32dev.build_flags}
  ; Prevent common globals from pulling the bundled old NimBLE privacy object.
  -fno-common
  -D BLE_JSON_DEFAULT_ENABLED=1
  -D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
  -D WLED_DISABLE_ALEXA
  -D WLED_DISABLE_HUESYNC
  -D WLED_DISABLE_INFRARED
  -D WLED_DISABLE_MQTT
  -D WLED_DISABLE_ADALIGHT
  -D WLED_DISABLE_LOXONE
  -D WLED_DISABLE_ESPNOW
  -D WLED_DISABLE_DMX
  -D WLED_DISABLE_DMX_INPUT
  -D WLED_DISABLE_PARTICLESYSTEM1D
  -D WLED_DISABLE_PARTICLESYSTEM2D
  -D WLED_DISABLE_PIXELFORGE
  -D WLED_DISABLE_IMPROV
build_unflags = ${env:esp32dev.build_unflags}
  -D WLED_ENABLE_DMX_INPUT
  -D WLED_ENABLE_GIF
board_build.partitions = tools/WLED_ESP32_4MB_1MB_FS.csv

[env:boardsesh_ble_audio]
extends = env:esp32dev
lib_deps = ${ble_json.lib_deps}
custom_usermods =
  audioreactive
  symlink://../wled-usermod-ble-json
build_flags = ${ble_json.build_flags}
  -D BLE_JSON_BUILD_ID=\"boardsesh-ble-json-0.1.0-audio\"
  -D BLE_JSON_AUDIO=1
build_unflags = ${ble_json.build_unflags}
board_build.partitions = ${ble_json.board_build.partitions}

; Explicitly audio-disabled candidate. Never silently substitute for audio image.
[env:boardsesh_ble_no_audio]
extends = env:esp32dev
lib_deps = ${ble_json.lib_deps}
custom_usermods = symlink://../wled-usermod-ble-json
build_flags = ${ble_json.build_flags}
  -D BLE_JSON_BUILD_ID=\"boardsesh-ble-json-0.1.0-no-audio\"
  -D BLE_JSON_AUDIO=0
build_unflags = ${ble_json.build_unflags}
board_build.partitions = ${ble_json.board_build.partitions}
